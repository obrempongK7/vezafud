; Vezafud Platform — Supervisor Configuration
; Ubuntu: /etc/supervisor/conf.d/vezafud.conf
; After editing: supervisorctl reread && supervisorctl update

; ─── Queue Workers ─────────────────────────────────────────────────────────

[program:vezafud-queue-default]
command=php /var/www/vezafud/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/vezafud
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vezafud-queue.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
user=www-data

[program:vezafud-queue-notifications]
command=php /var/www/vezafud/artisan queue:work redis --queue=notifications --sleep=1 --tries=3 --timeout=30 --max-time=3600
directory=/var/www/vezafud
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vezafud-notifications.log
user=www-data

[program:vezafud-queue-delivery]
command=php /var/www/vezafud/artisan queue:work redis --queue=delivery --sleep=1 --tries=5 --timeout=30 --max-time=3600
directory=/var/www/vezafud
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vezafud-delivery.log
user=www-data

[program:vezafud-queue-payments]
command=php /var/www/vezafud/artisan queue:work redis --queue=payments --sleep=2 --tries=5 --timeout=60 --max-time=3600
directory=/var/www/vezafud
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vezafud-payments.log
user=www-data

; ─── Laravel Reverb WebSocket Server ──────────────────────────────────────

[program:vezafud-reverb]
command=php /var/www/vezafud/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/vezafud
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vezafud-reverb.log
user=www-data

; ─── Scheduler (alternative to cron) ─────────────────────────────────────

[program:vezafud-scheduler]
command=php /var/www/vezafud/artisan schedule:work
directory=/var/www/vezafud
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/vezafud-scheduler.log
user=www-data
