##
## Vezafud Platform — Nginx Configuration
## Ubuntu 22.04 / 24.04 + PHP 8.3-FPM
## Place at: /etc/nginx/sites-available/vezafud
## Enable:   ln -s /etc/nginx/sites-available/vezafud /etc/nginx/sites-enabled/vezafud
##

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/vezafud/public;
    index index.php;

    # SSL — Certbot will fill these in:
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"                                    always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(self), microphone=(self)" always;

    # Rate limiting zones (define in nginx.conf http block)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    charset utf-8;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Main Laravel handler
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # API rate limiting
    location /api/ {
        # limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/v1/auth/ {
        # limit_req zone=auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb WebSocket
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass         http://127.0.0.1:8080;
        proxy_read_timeout 60s;
    }

    # Static assets with aggressive caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads
    location /storage/ {
        alias /var/www/vezafud/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Security: block sensitive files
    location ~ /\.(ht|git|env) { deny all; return 404; }
    location = /install.php         { deny all; return 404; }
    location ~ /\.php$              {
        location ~ \.(env|log|lock|json|md|yaml|yml|gitignore)$ { deny all; }
    }

    # Logs
    access_log  /var/log/nginx/vezafud_access.log;
    error_log   /var/log/nginx/vezafud_error.log warn;
}
